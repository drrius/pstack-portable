name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/poteto-mode/scripts/package-lock.json
      - run: npm test
      - run: npm ci --prefix skills/poteto-mode/scripts
      - run: npm run test:tools
      - run: npm run typecheck:tools
